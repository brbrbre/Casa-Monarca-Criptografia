{% extends 'base.html' %}
{% block content %}
  <div style="max-width: 700px; margin: 0 auto;">
    <div class="card">
      <h2>Validar certificado</h2>
      <p>Pega el certificado encriptado para validarlo contra este colaborador.</p>
      <form method="post">
        {% csrf_token %}
        <div class="field-group">
          <label for="certificate">Certificado encriptado</label>
          <textarea id="certificate" name="certificate" rows="10">{{ certificate|default:'' }}</textarea>
        </div>
        <div class="inline-actions">
          <button type="submit" class="btn">Validar certificado</button>
          <a href="{% url 'iam:detail' collaborator.pk %}" class="btn btn-light">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
