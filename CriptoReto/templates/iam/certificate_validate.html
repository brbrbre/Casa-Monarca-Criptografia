{% extends 'base.html' %}
{% block content %}
<div style="max-width:700px;margin:0 auto;">
  <div class="card">
    <h2 style="margin-bottom:8px;">Validar certificado</h2>
    <p style="color:var(--cm-text-muted);margin-bottom:18px;">Pega el certificado encriptado para validarlo contra este colaborador.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field-group">
        <label for="certificate">Certificado encriptado</label>
        <textarea id="certificate" name="certificate" rows="10">{{ certificate|default:'' }}</textarea>
      </div>
      <div class="inline-actions">
        <button type="submit" class="btn"><i class="fa-solid fa-shield-halved"></i> Validar certificado</button>
        <a href="{% url 'iam:detail' collaborator.pk %}" class="btn btn-light">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
