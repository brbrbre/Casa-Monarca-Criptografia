{% extends 'base.html' %}
{% block content %}
<div style="max-width:700px;margin:0 auto;">
  <div class="card">
    <h2 style="margin-bottom:8px;">Validar certificado</h2>
    <p style="color:var(--cm-text-muted);margin-bottom:18px;">Carga el certificado (.cert) y la clave privada (.key) para validarlos contra este colaborador.</p>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="field-group">
        <label for="cert_file">Certificado (.cert)</label>
        <input type="file" id="cert_file" name="cert_file" accept=".cert,.pem" required>
      </div>
      <div class="field-group">
        <label for="key_file">Clave privada (.key)</label>
        <input type="file" id="key_file" name="key_file" accept=".key,.pem" required>
      </div>
      <div class="inline-actions">
        <button type="submit" class="btn"><i class="fa-solid fa-shield-halved"></i> Validar certificado</button>
        <a href="{% url 'iam:detail' collaborator.pk %}" class="btn btn-light">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
