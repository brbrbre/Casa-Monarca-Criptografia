<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Monarca — Verificación de seguridad</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { width: 400px; background: #fff; padding: 28px; border: 1px solid #ddd; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.05); }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { color: #555; margin-bottom: 18px; font-size: 14px; }
    .question-box { background: #f5f5f5; border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; font-size: 15px; font-weight: 600; color: #111; margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 14px; font-size: 14px; box-sizing: border-box; }
    .btn { display: block; width: 100%; padding: 12px 14px; border: none; background: #111; color: #fff; border-radius: 10px; cursor: pointer; font-size: 15px; }
    .btn:hover { background: #333; }
    .message { padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
    .message-error { background: #fdeaea; border: 1px solid #f5c7c7; color: #8e1f1f; }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #555; text-decoration: none; }
    .back:hover { color: #111; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Verificación de seguridad</h1>
    <p>Responde tu pregunta de seguridad para continuar.</p>

    {% if messages %}
      {% for msg in messages %}
        <div class="message message-{{ msg.tags }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <div class="question-box">{{ question }}</div>

    <form method="post">
      {% csrf_token %}

      <label for="id_answer">Tu respuesta</label>
      {{ form.answer }}

      <button class="btn" type="submit">Verificar</button>
    </form>

    <a class="back" href="{% url 'iam:password_recovery_request' %}">← Volver</a>
  </div>
</body>
</html>
